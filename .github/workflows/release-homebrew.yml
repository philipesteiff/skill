name: Release Homebrew Formula

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  BINARY_NAME: skill
  FORMULA_NAME: skill
  STRICT_RELEASE: ${{ vars.STRICT_RELEASE }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  release-homebrew:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Verify tag matches Cargo.toml version (strict)
        if: env.STRICT_RELEASE == 'true'
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_TOML=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v${VERSION_TOML}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match Cargo.toml version v${VERSION_TOML}" >&2
            exit 1
          fi

      - name: Package release artifact
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          scripts/package.sh
          ARCH="$(uname -m)"
          ARCHIVE="dist/skill-darwin-${ARCH}.tar.gz"
          if [ ! -f "${ARCHIVE}" ]; then
            echo "Missing ${ARCHIVE}" >&2
            ls -la dist
            exit 1
          fi
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "ARCH=${ARCH}" >> "${GITHUB_ENV}"
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Compute checksum
        run: |
          CHECKSUM=$(shasum -a 256 "${ARCHIVE}" | awk '{print $1}')
          echo "CHECKSUM=${CHECKSUM}" >> "${GITHUB_ENV}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}

      - name: Switch to default branch for tap update
        run: |
          git checkout "${DEFAULT_BRANCH}"
          git pull --ff-only origin "${DEFAULT_BRANCH}"

      - name: Update Homebrew formula
        run: |
          FORMULA_CLASS=$(echo "${FORMULA_NAME}" | awk -F'[-_]' '{for (i=1;i<=NF;i++){printf toupper(substr($i,1,1)) substr($i,2)} }')
          FORMULA_DIR="Formula"
          FORMULA_PATH="${FORMULA_DIR}/${FORMULA_NAME}.rb"
          REPO_SLUG="${GITHUB_REPOSITORY}"
          ASSET_URL="https://github.com/${REPO_SLUG}/releases/download/${TAG}/skill-darwin-${ARCH}.tar.gz"
          mkdir -p "${FORMULA_DIR}"
          cat > "custom_download_strategy.rb" <<'RUBY'
          require "download_strategy"
          require "json"

          class GithubPrivateReleaseDownloadStrategy < CurlDownloadStrategy
            def initialize(url, name, version, **meta)
              super
              parse_api_url
            end

            private

            def parse_api_url
              url_match = @url.match(%r{https://github\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/(.+)})
              raise "Invalid URL: #{@url}" unless url_match

              owner = url_match[1]
              repo = url_match[2]
              tag = url_match[3]
              filename = url_match[4]

              @api_url = "https://api.github.com/repos/#{owner}/#{repo}/releases/tags/#{tag}"
              @filename = filename
            end

            def api_headers
              token = ENV["HOMEBREW_GITHUB_API_TOKEN"] || ENV["HOMEBREW_GITHUB_TOKEN"]
              return {} if token.nil? || token.empty?

              {"Authorization" => "token #{token}"}
            end

            def fetch_release
              curl_download(@api_url, to: temporary_path, *api_headers_to_args, "-H", "Accept: application/vnd.github+json")
              JSON.parse(File.read(temporary_path))
            end

            def api_headers_to_args
              api_headers.flat_map { |k, v| ["-H", "#{k}: #{v}"] }
            end

            def _fetch(url:, resolved_url:, timeout:)
              json = fetch_release
              assets = json.fetch("assets", [])
              asset = assets.find { |entry| entry["name"] == @filename }
              raise "Asset #{@filename} not found in #{@api_url}" if asset.nil?

              download_url = asset.fetch("url")
              curl_download(download_url, to: temporary_path, *api_headers_to_args, "-H", "Accept: application/octet-stream", timeout: timeout)
            end
          end
          RUBY
          cat > "${FORMULA_PATH}" <<RUBY
          class ${FORMULA_CLASS} < Formula
            desc "CLI for managing skills"
            homepage "https://github.com/${REPO_SLUG}"
            require_relative "../custom_download_strategy"
            url "${ASSET_URL}", using: GithubPrivateReleaseDownloadStrategy
            sha256 "${CHECKSUM}"
            version "${VERSION}"

            def install
              bin.install "${BINARY_NAME}"
            end
          end
          RUBY

      - name: Commit and push formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA_NAME}.rb" "custom_download_strategy.rb"
          git commit -m "${FORMULA_NAME} ${TAG}"
          git push
