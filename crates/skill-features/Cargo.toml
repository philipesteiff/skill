[package]
name = "skill-features"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
reqwest = { version = "0.13.1", features = ["blocking", "json"] }
serde_json = "1.0"
walkdir = "2.5"
skill-core = { path = "../skill-core" }

[dev-dependencies]
tempfile = "3.10"
